# PROPOSED tooling and dependency policy (Phase 0 blueprint).
# The package directory src/ecobackfire/ does not exist yet, so `pip install -e .`
# will not work until Phase 1 creates it. Nothing here implements the application.

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ecobackfire"
version = "0.1.0"
description = "Environmental stress-testing and discovery engine: finds where sustainable-looking choices fail or reverse."
readme = "README.md"
requires-python = ">=3.12,<3.13"   # pinned to 3.12 (the tested version; matches .python-version and Vercel)
license = { text = "UNDECIDED" }  # [OPEN] choose before any public release

# Core dependency budget (justified in docs/architecture.md section 2).
# Adding a runtime dependency requires a written justification in that table.
dependencies = [
  "pydantic>=2.6,<3",   # typed schemas, strict validation, JSON Schema export
  "pint>=0.23",         # dimensional analysis / unit safety
  "numpy>=1.26",        # numerics
  "scipy>=1.12",        # root finding (brentq), QMC sampling, distributions
]

[project.optional-dependencies]
sensitivity = ["SALib>=1.5"]            # [PROVISIONAL] only if own wrappers prove inadequate (Phase 4)
web = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]   # demo web layer only (web/), never imported by src/
ai = []                                 # provider SDKs added here in Phase 9, never in core
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pytest-cov>=5",
]

[project.scripts]
ecobackfire = "ecobackfire.cli.main:main"   # created in Phase 1

[tool.hatch.build.targets.wheel]
packages = ["src/ecobackfire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # lets tests/web import the demo layer in web/
addopts = "-ra --strict-markers"
markers = [
  "software: software-correctness tests",
  "scientific: model verification / benchmark tests (do not imply scientific validity)",
  "acceptance: end-to-end acceptance tests",
  "slow: long-running tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
# Uppercase names such as E0, C0, dC, EM0, L deliberately mirror the symbols in docs/first-experiment.md.
ignore = ["N802", "N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ecobackfire/contracts", "src/ecobackfire/core"]  # widen as modules stabilize

[tool.ruff.lint.per-file-ignores]
# web tests import pytest fixtures by name (F811), alias the module under test as R (N812), and carry long literal test text
"tests/web/*" = ["F811", "N812", "E501", "RUF028"]
# web layer (MVP): long user-facing message strings; exception names mirror the user-facing concepts
"web/*.py" = ["E501", "N818", "RUF028"]
